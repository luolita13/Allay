name: App Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0), leave empty to derive from git'
        required: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    env:
      SQLX_OFFLINE: true

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          path: code
          fetch-depth: 0

      - name: Check out EasyTier (sibling repo, required for link feature)
        uses: actions/checkout@v4
        with:
          repository: EasyTier/EasyTier
          path: EasyTier
          fetch-depth: 1

      - name: Setup Protoc
        uses: ariga/setup-protoc@v1

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: code/.nvmrc

      - name: Enable Corepack
        working-directory: code
        run: corepack enable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-cargo-registry-${{ hashFiles('code/**/Cargo.lock') }}
          restore-keys: |
            windows-cargo-registry-

      - name: Cache Cargo target
        uses: actions/cache@v4
        with:
          path: code/target
          key: windows-cargo-target-${{ hashFiles('code/**/Cargo.lock') }}
          restore-keys: |
            windows-cargo-target-

      - name: Setup Turbo cache
        uses: rharkor/caching-for-turbo@56219402aacc0d06b650d898c222996dbc1191ec # v2.3.14

      - name: Install dependencies
        working-directory: code
        run: pnpm install

      - name: Set app version
        shell: bash
        working-directory: code
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.0-$(git -C . rev-parse --short HEAD)"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Setting app version to $VERSION"
          node -e "
            const fs = require('fs');
            const p = 'apps/app-frontend/package.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          "
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" apps/app/Cargo.toml
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" packages/app-lib/Cargo.toml

      - name: Set app environment
        working-directory: code/packages/app-lib
        run: cp .env.prod .env

      - name: Build Tauri App (NSIS installer)
        working-directory: code
        run: pnpm --filter=@modrinth/app run tauri build --verbose --bundles nsis

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Allay-Windows-Setup
          path: code/target/release/bundle/nsis/*-setup.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: code/target/release/bundle/nsis/*-setup.exe
          generate_release_notes: true
          draft: true
          prerelease: false
